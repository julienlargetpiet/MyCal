<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel='icon' type='image/png' href='/assets/favicon.png'>
  <title>Login — MyCal</title>
  <script>
    // Use the same key in your calendar to share the theme preference.
    const THEME_KEY = 'mycal-theme';
    const storedTheme = localStorage.getItem(THEME_KEY);
    const initialTheme = storedTheme === 'light' || storedTheme === 'dark'
      ? storedTheme
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = initialTheme;
  </script>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #fff;
      --text: #172033;
      --muted: #677187;
      --border: #e2e7f0;
      --input: #fafbfe;
      --accent: #3558d4;
      --accent-hover: #2947b3;
      --accent-text: #fff;
      --error: #b42335;
      --focus: rgba(53, 88, 212, .18);
      --shadow: rgba(12, 26, 49, .09);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10151e;
      --card: #1b2330;
      --text: #f0f3f9;
      --muted: #abb5c6;
      --border: #354052;
      --input: #151d29;
      --accent: #7d9bff;
      --accent-hover: #a1b7ff;
      --accent-text: #101827;
      --error: #ff929e;
      --focus: rgba(125, 155, 255, .24);
      --shadow: rgba(0, 0, 0, .24);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 5%, var(--focus), transparent 45%), var(--bg);
      color: var(--text);
    }
    .layout { width: 100%; max-width: 410px; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .theme-toggle {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 999px; padding: 9px 13px; font: inherit; font-size: 13px;
      cursor: pointer;
    }
    .theme-toggle:hover { background: var(--input); }
    .brand { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-symbol {
      display: grid; place-items: center; width: 48px; height: 48px;
      border-radius: 15px; background: var(--accent); color: var(--accent-text);
      font-size: 24px; font-weight: 800;
    }
    .brand-name { font-size: 29px; font-weight: 800; letter-spacing: -.045em; }
    .panel {
      padding: 35px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 55px var(--shadow);
    }
    h1 { font-size: 25px; letter-spacing: -.04em; margin: 0 0 9px; }
    .subtitle { color: var(--muted); margin: 0 0 30px; line-height: 1.5; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 9px; }
    .field { margin-bottom: 21px; }
    input {
      width: 100%; height: 47px; padding: 0 14px;
      background: var(--input); color: var(--text);
      border: 1px solid var(--border); border-radius: 11px;
      font: inherit; font-size: 14px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 83px; }
    .toggle {
      position: absolute; right: 7px; top: 5px; height: 37px;
      border: none; background: none; color: var(--muted);
      padding: 0 9px; cursor: pointer; font-size: 12px; border-radius: 7px;
    }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .submit {
      display: block; width: 100%; height: 47px;
      border: 0; border-radius: 11px;
      background: var(--accent); color: var(--accent-text);
      font: inherit; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: background .15s, transform .15s;
    }
    .submit:hover:not(:disabled) { background: var(--accent-hover); }
    .submit:active:not(:disabled) { transform: translateY(1px); }
    .submit:disabled { cursor: wait; opacity: .7; }
    .message { min-height: 18px; margin: 16px 0 0; font-size: 13px; color: var(--error); text-align: center; line-height: 1.4; }
    .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 23px; }
    @media (max-width: 440px) { .panel { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main class="layout">
    <div class="toolbar">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Change theme">
        <span id="theme-icon" aria-hidden="true">☾</span>
        <span id="theme-label">Dark mode</span>
      </button>
    </div>
    <div class="brand" aria-label="MyCal">
      <div class="brand-symbol" aria-hidden="true">M</div>
      <span class="brand-name">MyCal</span>
    </div>

    <section class="panel" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back!</h1>
      <p class="subtitle">Sign in to access your calendar and files.</p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 maxlength="64" pattern="[A-Za-z0-9_.\-]+" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password"
                   autocomplete="current-password" maxlength="1024" required>
            <button class="toggle" type="button" id="toggle-password"
                    aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="submit" id="submit" type="submit">Sign in</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="footer">Your personal space.</p>
  </main>

  <script>
    const themeButton = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');

    function updateThemeButton() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeIcon.textContent = isDark ? '☀' : '🌙';
      themeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
      themeButton.setAttribute('aria-label', isDark ? 'Activate light mode' : 'Activate dark mode');
    }
    updateThemeButton();

    themeButton.addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem(THEME_KEY, nextTheme);
      updateThemeButton();
    });

    const form = document.getElementById('login-form');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');
    const toggle = document.getElementById('toggle-password');

    toggle.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.textContent = visible ? 'Show' : 'Hide';
      toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      // The C backend expects username:password without NUL/CR/LF.
      if (/[\r\n\0]/.test(password.value)) {
        message.textContent = 'The password contains invalid characters.';
        return;
      }

      submit.disabled = true;
      submit.textContent = 'Signing in...';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain; charset=utf-8',
            'X-MyCal-Request': '1'
          },
          credentials: 'same-origin',
          cache: 'no-store',
          body: `${username.value}:${password.value}`
        });

        if (response.ok) {
          window.location.replace('/');
          return;
        }

        message.textContent = response.status === 401
          ? 'Incorrect username or password.'
          : response.status === 403
            ? 'Request rejected by the server.'
            : 'Unable to sign in. Please try again.';

      } catch {
        message.textContent = 'Unable to connect to the server.';
      } finally {
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
